schema: spec-driven

context: |
  Project: Proagile 2026 multi-exercise technical challenge workspace.
  Scope: `Exercise_2_queries/` is the active area for `ea-governance-queries-exercise-2`.
  Historical component: `Addino/` is the completed, verified, and archived Exercise 1
  C#/.NET Framework 4.7.2 add-in; it is outside the Exercise 2 scope and must not be modified.
  Stack for Exercise 2: SQL queries over an Enterprise Architect repository; read-only SQLite
  inspection of the QEA repository; Enterprise Architect SQL/Search for final execution and
  validation; Markdown documentation and manual evidence. Prolaborate V5 is optional and deferred.
  Validation: SELECT/read-only queries, query execution, manual comparison with visible EA model
  content, and captured evidence. Never use UPDATE, INSERT, or DELETE against the QEA repository.
  Testing: No automated build or test runner applies to Exercise 2; strict TDD is disabled.

strict_tdd: false

sdd:
  initialized_change: ea-governance-queries-exercise-2
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  next_recommended: sdd-new

testing:
  test_runner:
    available: false
    command: ""
    framework: ""
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""
  build:
    available: false
    command: ""

rules:
  proposal:
    - Include a rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
  design:
    - Document architecture decisions with rationale.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
  apply:
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    checks:
      - Validate SELECT/read-only SQL query execution.
      - Contrast query results with visible Enterprise Architect model content.
      - Preserve manual execution evidence; never mutate the QEA repository.
  archive:
    - Warn before merging destructive deltas.
