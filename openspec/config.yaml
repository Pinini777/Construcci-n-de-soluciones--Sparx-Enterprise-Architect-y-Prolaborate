schema: spec-driven

context: |
  Project: Proagile 2026 multi-exercise technical challenge workspace.
  Delivery scope for the initialized independent change: `Exercise_1_Addin/`.
  Exercise 1 is a C#/.NET Framework 4.7.2 Windows Forms COM add-in for Enterprise Architect,
  built with a classic MSBuild project and validated through native compilation and manual EA
  execution evidence. Exercise 2 remains a separate protected delivery scope.
  Existing archived Exercise 1 and Exercise 2 changes are audit history and must not be modified.
  Validation: x64 MSBuild compilation plus manual Enterprise Architect interaction and evidence;
  no automated test project is present.

strict_tdd: false

sdd:
  initialized_change: ea-metadata-review-optionals-ui
  artifact_store: hybrid
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  next_recommended: sdd-explore

testing:
  test_runner:
    available: false
    command: ""
    framework: ""
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""
  build:
    available: true
    command: 'MSBuild.exe Exercise_1_Addin\Addino.csproj /t:Build /p:Configuration=Debug /p:Platform=x64'

rules:
  proposal:
    - Include a rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
  design:
    - Document architecture decisions with rationale.
  tasks:
    - Group tasks by phase and keep each task completable in one session.
  apply:
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: 'MSBuild.exe Exercise_1_Addin\Addino.csproj /t:Build /p:Configuration=Debug /p:Platform=x64'
    checks:
      - Validate x64 MSBuild compilation of the Exercise 1 add-in.
      - Validate optional behavior through manual Enterprise Architect execution evidence.
      - Do not modify protected Exercise 2 or archived artifacts.
  archive:
    - Warn before merging destructive deltas.
